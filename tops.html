<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Shop SOMEWHERE tops - elevated essentials and statement silhouettes.">
    <title>Tops - SOMEWHERE</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="SOMEWHERE"><img src="images/brand/somewhere-logo.png" alt="SOMEWHERE"></a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="shop-all.html" class="nav-link">The Edit</a></li>
                <li><a href="bottoms.html" class="nav-link">Bottoms</a></li>
                <li><a href="tops.html" class="nav-link active">Tops</a></li>
                <li><a href="sets.html" class="nav-link">Sets</a></li>
            </ul>
            <div class="nav-icons">
                <a href="cart.html" class="icon-btn cart-btn" aria-label="Bag">🛒 <span class="cart-count" id="cartCount">0</span></a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="category-page">
        <header class="category-page-hero">
            <img src="images/categories/tops.png" alt="SOMEWHERE tops collection">
            <h1 class="category-page-hero-title">TOPS</h1>
        </header>
        <div class="category-page-body">
            <h2 class="section-title">Tops</h2>
            <div class="collection-grid" data-category="tops">
                <div class="collection-item" data-sizes="M/L,L/XL">
                    <div class="collection-image">
                        <img src="images/products/striped-crochet-halter-top.png" alt="Striped Crochet Halter Top">
                        <div class="collection-overlay">
                            <button type="button" class="quick-view">View Piece</button>
                        </div>
                    </div>
                    <div class="collection-info">
                        <h3>Striped Crochet Halter Top</h3>
                        <p class="price">1,450 EGP</p>
                        <p class="collection-sizes-hint">Sizes: M/L · L/XL</p>
                    </div>
                </div>
            </div>
            <a href="index.html" class="category-page-back">← Back home</a>
            <nav class="category-page-nav-links" aria-label="Other categories">
                <a href="bottoms.html">Bottoms</a>
                <a href="sets.html">Sets</a>
            </nav>
        </div>
    </main>

    <div class="quick-view-modal" id="quickViewModal" aria-hidden="true">
        <div class="quick-view-overlay"></div>
        <div class="quick-view-content">
            <button type="button" class="quick-view-close" aria-label="Close">&times;</button>
            <div class="quick-view-body">
                <div class="quick-view-image" id="modalProductImage"></div>
                <div class="quick-view-details">
                    <h3 class="quick-view-title" id="modalProductName"></h3>
                    <p class="quick-view-price" id="modalProductPrice"></p>
                    <div class="quick-view-sizes">
                        <span class="quick-view-label">Size:</span>
                        <div class="size-options" id="modalSizeOptions"></div>
                    </div>
                    <div class="quick-view-quantity" id="quickViewQuantity" style="display: none;">
                        <span class="quick-view-label">Quantity:</span>
                        <div class="quick-qty-controls">
                            <button type="button" class="quick-qty-btn" id="quickQtyDec" aria-label="Decrease quantity">-</button>
                            <span class="quick-qty-value" id="quickQtyValue">1</span>
                            <button type="button" class="quick-qty-btn" id="quickQtyInc" aria-label="Increase quantity">+</button>
                        </div>
                    </div>
                    <div class="quick-view-actions">
                        <button type="button" class="quick-view-add">Add to Bag</button>
                        <button type="button" class="quick-view-checkout">Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/price-utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
